# i3 touchpad gestures (libinput-gestures)
# 3-finger horizontal: workspaces | vertical: scratchpad

gesture swipe left  3 i3-msg workspace next
gesture swipe right 3 i3-msg workspace prev
gesture swipe up    3 i3-msg scratchpad show
gesture swipe down  3 i3-msg scratchpad show

# 4-finger: back-and-forth / kill focused
gesture swipe left  4 i3-msg workspace back_and_forth
gesture swipe right 4 i3-msg workspace back_and_forth
gesture swipe up    4 i3-msg fullscreen toggle
gesture swipe down  4 i3-msg kill
