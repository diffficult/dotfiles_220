<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>

  <!-- Serif fonts -->
  <alias>
    <family>serif</family>
    <prefer><family>Linux Libertine</family></prefer>
  </alias>

  <!-- Sans-serif fonts -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>Linux Biolinum</family></prefer>
  </alias>

  <!-- Sans fonts -->
  <alias>
    <family>sans</family>
    <prefer><family>Linux Biolinum</family></prefer>
  </alias>

  <!-- Monospace fonts - Nerd Font optimized -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Iosevka Nerd Font Mono</family>
      <family>FiraCode Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Emoji fonts -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
      <family>Noto Emoji</family>
    </prefer>
  </alias>

  <!-- Powerline symbols fallback -->
  <alias>
    <family>PowerlineSymbols</family>
    <prefer>
      <family>Symbols Nerd Font Mono</family>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Generic fallback for nerd symbols -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Symbols Nerd Font Mono</string>
    </edit>
  </match>

  <!-- Ensure Noto Color Emoji is available -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Color Emoji</string>
    </edit>
  </match>

</fontconfig>
